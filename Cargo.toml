[workspace]
members = [
    "sph-gpu",
    "experiments/shocktube",
    "experiments/benchmark",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/massively-labs/sph-gpu"

[workspace.dependencies]
# Keep Massively on the requested release tag. Cargo.lock also pins its CubeCL revision.
massively = { git = "https://github.com/akiradeveloper/massively", tag = "v0.80" }
cubecl = { git = "https://github.com/tracel-ai/cubecl.git", branch = "main", default-features = false, features = [
    "std",
    "stdlib",
    "wgpu",
] }
clap = { version = "4.5", features = ["derive"] }
proptest = "1.7"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
